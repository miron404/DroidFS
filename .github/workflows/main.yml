name: Build DroidFS (arm64)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config git gnupg2 wget npm unzip \
            python3

      - name: Set up Android SDK
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;37.0.0" \
            "platforms;android-34" \
            "ndk;28.2.13676358" \
            "cmake;4.1.2"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "CMAKE_HOME=$ANDROID_SDK_ROOT/cmake/4.1.2" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmake/4.1.2/bin" >> $GITHUB_PATH

      - name: Build FFmpeg
        working-directory: app/ffmpeg
        run: |
          chmod +x build.sh
          ./build.sh arm64-v8a

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create default debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Sign APK with default key
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out DroidFS-arm64-signed.apk \
            "$APK"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidFS-arm64-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidFS-arm64-signed
          path: DroidFS-arm64-signed.apk
