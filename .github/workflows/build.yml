name: Build DroidFS (arm64, gocryptfs only)

on:
  push:
    branches: ["mte-fix-boundary"]
  workflow_dispatch:

# The workflow only ever reads the repository; it publishes nothing back.
permissions:
  contents: read

# A newer push makes the running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ABI: arm64-v8a
  NDK_VERSION: "28.2.13676358"
  BUILD_TOOLS: "37.0.0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned submodule commits
        id: subs
        run: |
          echo "ffmpeg=$(git rev-parse HEAD:app/ffmpeg/ffmpeg)" >> "$GITHUB_OUTPUT"
          echo "gocryptfs=$(git rev-parse HEAD:app/libgocryptfs)" >> "$GITHUB_OUTPUT"

      # CryFS is left out of this build on purpose (-PdisableCryFS below), so its submodule
      # is never checked out and the Boost compile that dominated CI time never happens.
      - name: Check out submodules
        run: |
          git submodule update --init app/libgocryptfs
          git submodule update --init --recursive libpdfviewer

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git wget unzip python3

      - name: Set up Android SDK
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;$BUILD_TOOLS" \
            "platforms;android-34" \
            "ndk;$NDK_VERSION" \
            "cmake;4.1.2"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmake/4.1.2/bin" >> $GITHUB_PATH

      # FFmpeg takes minutes and only changes when its submodule or build script does.
      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: app/ffmpeg/build
          key: ffmpeg-${{ env.ABI }}-ndk${{ env.NDK_VERSION }}-${{ steps.subs.outputs.ffmpeg }}-${{ hashFiles('app/ffmpeg/build.sh') }}

      - name: Check out FFmpeg sources
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: git submodule update --init app/ffmpeg/ffmpeg

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        working-directory: app/ffmpeg
        run: |
          chmod +x build.sh
          ./build.sh "$ABI"

      # libgocryptfs/build.sh skips the OpenSSL compile when lib/<abi> already exists,
      # so restoring these two directories is enough to skip it.
      - name: Cache OpenSSL build
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: |
            app/libgocryptfs/lib
            app/libgocryptfs/include
          key: openssl-${{ env.ABI }}-ndk${{ env.NDK_VERSION }}-${{ steps.subs.outputs.gocryptfs }}

      - name: Check out OpenSSL sources
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        working-directory: app/libgocryptfs
        run: git submodule update --init openssl

      - name: Build libgocryptfs
        working-directory: app/libgocryptfs
        run: |
          chmod +x build.sh
          ./build.sh "$ABI"
          readelf -n "build/$ABI/libgocryptfs.so" | grep -A1 -i "build id" || true

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pabi="$ABI" -Pnouniversal -PdisableCryFS=true

      - name: Sign a copy with a throwaway key
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Built: $APK"
          sha256sum "$APK"
          cp "$APK" DroidFS-arm64-unsigned.apk
          # Needed to read stack traces: R8 renumbers lines and merges classes even with
          # -dontobfuscate, so a crash report is not decodable without the mapping of this
          # exact build.
          cp app/build/outputs/mapping/release/mapping.txt mapping.txt
          # Convenience only. The key is generated here and discarded with the runner, so every
          # build is signed by a different identity: installing over the previous one requires
          # uninstalling first. Sign DroidFS-arm64-unsigned.apk with your own key to keep updates.
          keytool -genkeypair \
            -keystore /tmp/throwaway.keystore \
            -storepass android \
            -alias throwaway \
            -keypass android \
            -dname "CN=DroidFS CI throwaway,O=DroidFS,C=US" \
            -keyalg EC \
            -groupname secp256r1 \
            -validity 10000
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/throwaway.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out DroidFS-arm64-throwaway-signed.apk \
            "$APK"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DroidFS-arm64-gocryptfs-only
          path: |
            DroidFS-arm64-unsigned.apk
            DroidFS-arm64-throwaway-signed.apk
            mapping.txt
