import com.android.build.api.variant.ResValue
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'

android {
    compileSdk = 37
    ndkVersion '28.2.13676358'
    namespace "sushi.hardcore.droidfs"

    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    defaultConfig {
        applicationId "sushi.hardcore.droidfs"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 38
        versionName "2.3.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild.cmake {
            // No additional arguments needed
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }

    lint {
        // LintVital crashes in AGP 9.3.0 due to internal JavaDocParser incompatibility
        // (see https://github.com/objectbox/objectbox-java/issues/1241). Remove when fixed upstream.
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '4.1.2'
        }
    }

    sourceSets {
        main {
            java {
                exclude 'androidx/camera/video/originals/**'
            }
            kotlin {
                exclude 'androidx/camera/video/originals/**'
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.resValues.put(
            variant.makeResValueKey("string", "versionName"),
            new ResValue(variant.outputs.first().versionName.get(), "")
        )
        variant.outputs.each { output ->
            output.outputFileName.set("DroidFS-v${android.defaultConfig.versionName}-${variant.name}.apk")
        }
    }
}

dependencies {
    implementation project(":libpdfviewer:app")
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"

    def lifecycle_version = "2.8.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"

    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation 'com.google.android.material:material:1.12.0'

    implementation "io.coil-kt.coil3:coil:3.4.0"
    implementation "io.coil-kt.coil3:coil-video:3.4.0"

    implementation "androidx.biometric:biometric-ktx:1.2.0-alpha05"

    def media3_version = "1.10.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"

    def camerax_version = "1.6.1"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-extensions:$camerax_version"

    // dependencies needed by CameraX patch
    implementation "androidx.concurrent:concurrent-futures:1.3.0"
    def autoValueVersion = '1.11.1'
    implementation "com.google.auto.value:auto-value-annotations:$autoValueVersion"
    annotationProcessor "com.google.auto.value:auto-value:$autoValueVersion"
}
